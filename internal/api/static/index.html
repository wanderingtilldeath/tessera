<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrawlerX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><span class="brand"><i aria-hidden="true"></i>CrawlerX</span></header>

<main>
  <p id="error" class="err" role="alert" hidden></p>

  <section id="add">
    <h2>Add documents</h2>
    <form id="addForm">
      <textarea id="urls" rows="3" placeholder="Page URLs, one per line" aria-label="page URLs"></textarea>
      <div class="drop" id="drop">
        Drop files here or <button type="button" class="link" id="pick">choose</button>
        <input type="file" id="files" multiple accept=".pdf,.md,.markdown,.html,.htm,.txt" hidden aria-label="files">
      </div>
      <ul class="chips" id="chips"></ul>
      <details>
        <summary>Options</summary>
        <div class="options">
          <input type="text" id="name" placeholder="Batch name" maxlength="100" aria-label="batch name">
          <label>Follow links <input type="number" id="depth" value="0" min="0" max="10"></label>
          <input type="text" id="prefixes" placeholder="Only paths starting with, e.g. /docs/" aria-label="path prefixes">
          <input type="text" id="hosts" placeholder="Allowed hosts, comma separated" aria-label="allowed hosts">
        </div>
      </details>
      <div class="row"><button id="start">Start</button><span id="addMsg" class="muted" role="status"></span></div>
    </form>

    <div id="progress" hidden>
      <div class="line"><span id="progressText"></span><span id="progressPct"></span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar"><div></div></div>
      <ul class="problems" id="problems"></ul>
    </div>
  </section>

  <section id="library">
    <h2>Documents</h2>
    <div class="row">
      <select id="batch" aria-label="batch"></select>
      <input type="search" id="filter" placeholder="Filter" aria-label="filter documents" hidden>
      <label class="muted"><input type="checkbox" id="all"> Select all</label>
    </div>
    <ul class="docs" id="docs"></ul>
  </section>

  <section id="search">
    <h2>Search</h2>
    <form id="searchForm" class="row">
      <input type="search" id="q" placeholder="Ask a question" required aria-label="question">
      <button id="searchBtn">Search</button>
    </form>
    <p class="muted" id="scope"></p>
    <div id="results" aria-live="polite"></div>
  </section>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
