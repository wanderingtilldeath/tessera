# make up   -> postgres (with pgvector), redis, ollama (embeddings), fakesite and two crawler processes
# The first start downloads the embedding model (~270 MB) into ./.ollama; until it
# arrives the crawlers keep working and chunks wait for their embeddings.
# Prometheus is optional: docker compose --profile metrics up
x-crawler: &crawler
  build: { context: ., args: { TARGET: crawlerx } }
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &crawler-env
    DATABASE_URL: postgres://crawlerx:crawlerx@postgres:5432/crawlerx?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    EMBED_URL: http://ollama:11434
    HOST_DELAY: 200ms
    USER_AGENT: "CrawlerX/1.0 (+https://github.com/wanderingtilldeath/docs-rag-ingest)"

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment: { POSTGRES_USER: crawlerx, POSTGRES_PASSWORD: crawlerx, POSTGRES_DB: crawlerx }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U crawlerx"], interval: 2s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 3s, retries: 20 }
  ollama:
    image: ollama/ollama
    volumes: ["./.ollama:/root/.ollama"]
    ports: ["11434:11434"]
    healthcheck: { test: ["CMD", "ollama", "list"], interval: 5s, timeout: 5s, retries: 20 }
  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama: { condition: service_healthy }
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    restart: "no"
  fakesite:
    build: { context: ., args: { TARGET: fakesite } }
    command: ["-addr", "0.0.0.0", "-port", "9000", "-pages", "2000", "-chaos"]
    ports: ["9000:9000"]
  crawler1:
    <<: *crawler
    ports: ["8081:8080"]
  crawler2:
    <<: *crawler
    ports: ["8082:8080"]
  prometheus:
    profiles: [metrics]
    image: prom/prometheus
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
